name: Update Activity Graph

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate activity graph
        run: |
          mkdir -p dist

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github-readme-activity-graph.vercel.app/graph?username=Pralexio&theme=github-dark&hide_border=true&area=true" \
            --output dist/activity-graph.svg

      - name: Publish activity graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b output

          git add activity-graph.svg
          git commit -m "Update activity graph"

          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push --force origin output
